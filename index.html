<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><title>LINXOVA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000}
#particles{position:fixed;inset:0;width:100%;height:100%;background:#000}
.logo-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.logo{width:min(72vw,900px);max-height:65vh;object-fit:contain;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 0 12px #ffffff26) drop-shadow(0 0 30px #4696ff2e)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.3deg)}50%{transform:translateY(-18px) rotate(.3deg)}}
@media(max-width:700px){.logo{width:86vw}}@media(prefers-reduced-motion:reduce){.logo{animation:none}}
</style></head>
<body><canvas id="particles"></canvas><div class="logo-wrap"><img class="logo" src="linxova_logo.png" alt="LINXOVA"></div>
<script>
const c=document.getElementById("particles"),x=c.getContext("2d"),C=["80,170,255","130,90,255","255,185,55","50,225,210","255,90,170","255,255,255"];let w,h,p=[];
function particle(y=Math.random()*h){let d=Math.random();return{x:Math.random()*w,y,s:.7+d*2.4,vy:.08+d*.32,vx:(Math.random()-.5)*.12,a:.15+Math.random()*.65,t:Math.random()*6.28,dt:.008+Math.random()*.018,c:C[Math.floor(Math.random()*C.length)],g:Math.random()>.72}}
function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;c.style.width=w+"px";c.style.height=h+"px";x.setTransform(d,0,0,d,0,0);p=Array.from({length:Math.max(45,Math.min(130,Math.floor(w*h/13000)))},()=>particle())}
function frame(){x.clearRect(0,0,w,h);for(let q of p){q.y-=q.vy;q.x+=q.vx;q.t+=q.dt;if(q.y<-25||q.x<-25||q.x>w+25)Object.assign(q,particle(h+20));let a=q.a*(.68+Math.sin(q.t)*.32);if(q.g){let z=x.createRadialGradient(q.x,q.y,0,q.x,q.y,q.s*7);z.addColorStop(0,`rgba(${q.c},${a})`);z.addColorStop(.3,`rgba(${q.c},${a*.3})`);z.addColorStop(1,`rgba(${q.c},0)`);x.fillStyle=z;x.beginPath();x.arc(q.x,q.y,q.s*7,0,6.283);x.fill()}x.fillStyle=`rgba(${q.c},${a})`;x.beginPath();x.arc(q.x,q.y,q.s,0,6.283);x.fill()}requestAnimationFrame(frame)}
addEventListener("resize",resize);resize();frame();
</script></body></html>
